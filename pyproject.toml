[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rogue-transmitter-detector"
version = "0.1.0"
description = "Receive-only N78 spectrum monitoring and signal-pattern classification prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
deep-learning = ["torch>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]
